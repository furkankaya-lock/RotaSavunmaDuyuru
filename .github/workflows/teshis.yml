name: Teshis

# Sadece elle çalıştırılır. Siteye GitHub sunucusundan ulaşılıp ulaşılamadığını ölçer.
# Hiçbir şey göndermez, repoya yazmaz.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Erişim testi
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          echo "Calisan sunucunun IP adresi:"
          curl -sS -m 10 https://api.ipify.org || true
          echo
          for URL in \
            https://personeltemin.jandarma.gov.tr/ \
            https://www.jandarma.gov.tr/duyurular \
            https://personeltemin.msb.gov.tr/ ; do
            echo "=================================================="
            echo "ADRES: $URL"
            HOST=$(echo "$URL" | sed -E 's#https://([^/]+)/.*#\1#')
            echo "--- DNS:"
            getent hosts "$HOST" || echo "DNS cozulemedi"
            echo "--- TCP 443 baglanti testi (10 sn):"
            timeout 10 bash -c "</dev/tcp/$HOST/443" && echo "TCP baglandi" || echo "TCP BAGLANAMADI / zaman asimi"
            echo "--- HTTPS istegi (25 sn):"
            curl -sS -k -m 25 -A "$UA" -H "Accept-Language: tr-TR,tr;q=0.9" \
              -o /tmp/out.html \
              -w "durum=%{http_code} baglanti=%{time_connect}s tls=%{time_appconnect}s ilkbayt=%{time_starttransfer}s toplam=%{time_total}s boyut=%{size_download}\n" \
              "$URL" || echo "CURL HATASI kodu=$?"
            echo "--- Ilk 200 karakter:"
            head -c 200 /tmp/out.html 2>/dev/null || true
            echo
            rm -f /tmp/out.html
          done
